<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hệ thống Nhận diện &amp; Chẩn đoán Ảnh Y tế (CT &amp; MRI)</title>
    <meta name="description" content="Dashboard trực quan hóa mô hình Deep Learning nhận diện ảnh CT và MRI, phát hiện u não và đột quỵ với độ chính xác cao." />
    <meta name="theme-color" content="#2c7a7b" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="bg-grid" aria-hidden="true"></div>
    <header class="site-header">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <h1>NHẬN DIỆN &amp; PHÂN LOẠI ẢNH CT / MRI</h1>
            <p class="tagline">
              Hệ thống chẩn đoán y tế AI: Phân loại tự động MRI/CT, phát hiện U não (AlexNet) và Đột quỵ não (ResNet18).
            </p>
          </div>
        </div>
        <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Đổi giao diện sáng/tối">
          🌙 Giao diện tối
        </button>
      </div>
      <nav class="tabs" role="tablist" aria-label="Chọn tập dữ liệu và chế độ">
        <button type="button" class="tab is-active" role="tab" aria-selected="true" data-panel="modality">
          🔍 Tự động nhận diện (CT / MRI)
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-panel="mri">
          🧠 MRI - U não
        </button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-panel="strokeCt">
          🩻 CT - Đột quỵ
        </button>
      </nav>
    </header>

    <main>
      <div id="status" class="status" role="status" aria-live="polite"></div>

      <section id="panel-modality" class="panel is-active" data-panel="modality" role="tabpanel">
        <div class="panel-inner" id="content-modality"></div>
      </section>
      <section id="panel-mri" class="panel" data-panel="mri" role="tabpanel" hidden>
        <div class="panel-inner" id="content-mri"></div>
      </section>
      <section id="panel-strokeCt" class="panel" data-panel="strokeCt" role="tabpanel" hidden>
        <div class="panel-inner" id="content-strokeCt"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        <strong>Đồ án chuyên ngành 3 (DACN3)</strong> &bull; Hướng dẫn suy luận: Chạy <code>python backend/inference_server.py</code> cho Inference backend hoặc kết nối qua <code>INFERENCE_URL</code>.
      </p>
    </footer>
  </body>
</html>
